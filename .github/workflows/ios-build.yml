name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Preuzimanje koda
        uses: actions/checkout@v4

      - name: Podešavanje Java 21 (za Gradle 9.6)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Dozvola za izvršavanje Gradle-a
        run: chmod +x gradlew

      - name: 1. Kompajliranje Kotlin iOS koda (Shared Framework)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: 2. Kompajliranje iOS Aplikacije (Xcode)
        run: |
          export JAVA_HOME=$JAVA_HOME_21_ARM64
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 3. Pakovanje u .ipa fajl
        run: |
          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/*.app Payload/
          zip -r TaposUtovar.ipa Payload

      - name: 4. Upload gotovog .ipa fajla
        uses: actions/upload-artifact@v4
        with:
          name: TaposUtovar-iOS-IPA
          path: TaposUtovar.ipa
